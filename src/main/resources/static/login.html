
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Login - Online Learning Platform</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

        }

        .logo {

            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 32px;
            font-weight: bold;
        }

        h1 {

            text-align: center;

            color: #333;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 28px;
        }

        label {

            display: block;

            color: #444;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;
        }

        input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .requirements {

            background: #f5f3ff;

            border-left: 4px solid #764ba2;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 22px;
        }

        .requirements p {

            font-weight: bold;

            color: #555;

            margin-bottom: 7px;
        }

        .requirements ul {

            padding-left: 18px;

            color: #666;

            font-size: 13px;

            line-height: 1.7;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(102, 126, 234, 0.35);
        }

        #message {

            margin-top: 18px;

            text-align: center;

            color: #d63031;

            font-size: 14px;

            font-weight: bold;
        }

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #999;

            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            O
        </div>

        <h1>Online Learning Platform</h1>

        <p class="subtitle">
            Login to continue your learning journey
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <div class="requirements">

                <p>Password must contain:</p>

                <ul>
                    <li>At least 8 characters</li>
                    <li>One uppercase letter</li>
                    <li>One lowercase letter</li>
                    <li>One number</li>
                    <li>One special character</li>
                </ul>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="footer">
            Secure • Learn • Grow
        </p>

    </div>


    <script>

        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                let email =
                    document.getElementById("email").value;

                let password =
                    document.getElementById("password").value;

                let message =
                    document.getElementById("message");


                let passwordPattern =
                    /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$/;


                if (!passwordPattern.test(password)) {

                    message.innerHTML =
                        "Password must contain at least 8 characters, " +
                        "one uppercase letter, one lowercase letter, " +
                        "one number and one special character.";

                    return;
                }


                fetch(
                    "/login?email=" +
                    encodeURIComponent(email) +
                    "&password=" +
                    encodeURIComponent(password),
                    {
                        method: "POST"
                    }
                )

                .then(response => response.json())

                .then(data => {

                    if (!data.success) {

                        message.innerHTML =
                            data.message;

                        return;
                    }


                    // Store logged-in user's ID
                    localStorage.setItem(
                        "userId",
                        data.userId
                    );


                    // Store user's role
                    localStorage.setItem(
                        "userRole",
                        data.role
                    );


                    if (data.role === "ADMIN") {

                        window.location.href =
                            "/admin.html";

                    }

                    else if (data.role === "INSTRUCTOR") {

                        window.location.href =
                            "/instructor.html";

                    }

                    else if (data.role === "USER") {

                        window.location.href =
                            "/student.html";

                    }

                    else {

                        message.innerHTML =
                            "Invalid role.";

                    }

                })

                .catch(error => {

                    console.error(error);

                    message.innerHTML =
                        "Login failed. Please try again.";

                });

            });

    </script>

</body>

</html>
