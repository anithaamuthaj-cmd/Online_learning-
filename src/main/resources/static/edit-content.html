<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Edit Course Content</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Edit Course Content</h1>

    <h2>Update Content</h2>

    <form id="contentForm">

        <label>Content ID</label><br>
        <input type="number" id="contentId" readonly><br><br>

        <label>Content Title</label><br>
        <input type="text" id="title" required><br><br>

        <label>Content URL</label><br>
        <input type="text" id="contentUrl" required><br><br>

        <label>Content Type</label><br>

        <select id="contentType" required>

            <option value="VIDEO">VIDEO</option>
            <option value="PDF">PDF</option>

        </select>

        <br><br>

        <label>Duration (minutes)</label><br>
        <input type="number" id="duration" required><br><br>

        <button type="submit">
            Update Content
        </button>

    </form>

    <br>

    <button onclick="goBack()">
        Back to Manage Content
    </button>


    <script>

        let params =
            new URLSearchParams(window.location.search);

        let contentId =
            params.get("contentId");

        document.getElementById("contentId").value =
            contentId;


        function loadContent() {

            fetch("/course-content/" + contentId)

            .then(response => response.json())

            .then(content => {

                document.getElementById("title").value =
                    content.title;

                document.getElementById("contentUrl").value =
                    content.contentUrl;

                document.getElementById("contentType").value =
                    content.contentType;

                document.getElementById("duration").value =
                    content.duration;

            })

            .catch(error => {

                alert("Unable to load content.");

            });

        }


        document.getElementById("contentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let title =
                document.getElementById("title").value;

            let contentUrl =
                document.getElementById("contentUrl").value;

            let contentType =
                document.getElementById("contentType").value;

            let duration =
                document.getElementById("duration").value;


            let body =
                "title=" + encodeURIComponent(title) +
                "&contentUrl=" +
                encodeURIComponent(contentUrl) +
                "&contentType=" +
                encodeURIComponent(contentType) +
                "&duration=" +
                encodeURIComponent(duration);


            fetch("/update-course-content/" + contentId, {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body: body

            })

            .then(response => response.text())

            .then(result => {

                alert(result);

                window.location.href =
                    "/manage-content.html";

            })

            .catch(error => {

                alert("Unable to update course content.");

            });

        });


        function goBack() {

            window.location.href =
                "/manage-content.html";

        }


        loadContent();

    </script>

</body>

</html>
