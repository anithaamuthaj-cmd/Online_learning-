<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java Basics Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Java Basics Quiz</h1>

<p>Answer the following questions and submit the quiz.</p>

<div id="quizContainer">
    Loading questions...
</div>

<button onclick="submitQuiz()">Submit Quiz</button>

<h2 id="result"></h2>

<script>

let questions = [];

let userId = localStorage.getItem("userId");

if (!userId) {
    userId = "2";
}

fetch("/quiz-questions?quizId=1")
    .then(response => response.json())
    .then(data => {

        questions = data;

        let quizContainer =
            document.getElementById("quizContainer");

        quizContainer.innerHTML = "";

        questions.forEach((question, index) => {

            let questionDiv =
                document.createElement("div");

            questionDiv.innerHTML =
                "<h3>" +
                (index + 1) +
                ". " +
                question.questionText +
                "</h3>" +

                "<label>" +
                "<input type='radio' " +
                "name='question" + question.questionId +
                "' value='A'>" +
                " A. " + question.optionA +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='question" + question.questionId +
                "' value='B'>" +
                " B. " + question.optionB +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='question" + question.questionId +
                "' value='C'>" +
                " C. " + question.optionC +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='question" + question.questionId +
                "' value='D'>" +
                " D. " + question.optionD +
                "</label><br><hr>";

            quizContainer.appendChild(questionDiv);
        });
    })
    .catch(error => {

        document.getElementById("quizContainer").innerHTML =
            "Unable to load quiz questions.";

    });


function submitQuiz() {

    let answers = {};

    questions.forEach(question => {

        let selected =
            document.querySelector(
                "input[name='question" +
                question.questionId +
                "']:checked"
            );

        if (selected) {

            answers[question.questionId] =
                selected.value;
        }
    });

    if (Object.keys(answers).length === 0) {

        document.getElementById("result").innerHTML =
            "Please answer at least one question.";

        return;
    }

    fetch(
        "/submit-quiz?quizId=1&userId=" + userId,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(answers)
        }
    )
    .then(response => response.json())
    .then(data => {

        if (data.success) {

            document.getElementById("result").innerHTML =
                "Your Score: " +
                data.score +
                " / " +
                data.totalQuestions +
                "<br>" +
                "Percentage: " +
                data.percentage.toFixed(2) +
                "%<br>" +
                "Result: " +
                data.resultStatus;

        } else {

            document.getElementById("result").innerHTML =
                data.message;
        }

    })
    .catch(error => {

        document.getElementById("result").innerHTML =
            "Unable to submit quiz.";

    });
}

</script>

</body>
</html>
