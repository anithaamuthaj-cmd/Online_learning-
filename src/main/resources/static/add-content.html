<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Add Course Content</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Add Course Content</h1>

    <h2>Add New Content</h2>

    <form id="contentForm">

        <label>Course ID</label><br>
        <input type="number" id="courseId" readonly><br><br>

        <label>Content Title</label><br>
        <input type="text" id="title" required><br><br>

        <label>Content URL</label><br>
        <input type="text" id="contentUrl" required><br><br>

        <label>Content Type</label><br>

        <select id="contentType" required>

            <option value="">Select Type</option>
            <option value="VIDEO">VIDEO</option>
            <option value="PDF">PDF</option>

        </select>

        <br><br>

        <label>Duration (minutes)</label><br>
        <input type="number" id="duration" required><br><br>

        <button type="submit">
            Save Content
        </button>

    </form>

    <br>

    <button onclick="goBack()">
        Back to Manage Content
    </button>


    <script>

        let params =
            new URLSearchParams(window.location.search);

        let courseId =
            params.get("courseId");

        document.getElementById("courseId").value =
            courseId;


        document.getElementById("contentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let title =
                document.getElementById("title").value;

            let contentUrl =
                document.getElementById("contentUrl").value;

            let contentType =
                document.getElementById("contentType").value;

            let duration =
                document.getElementById("duration").value;


            let body =
                "courseId=" + encodeURIComponent(courseId) +
                "&title=" + encodeURIComponent(title) +
                "&contentUrl=" + encodeURIComponent(contentUrl) +
                "&contentType=" + encodeURIComponent(contentType) +
                "&duration=" + encodeURIComponent(duration);


            fetch("/add-course-content", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: body

            })
            .then(response => response.text())
            .then(result => {

                alert(result);

                window.location.href =
                    "/manage-content.html";

            })
            .catch(error => {

                alert("Unable to add course content.");

            });

        });


        function goBack() {

            window.location.href =
                "/manage-content.html";

        }

    </script>

</body>

</html>
